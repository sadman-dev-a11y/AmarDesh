name: Verify, build Android and publish
on:
  push:
    branches: [main, CineDesk]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: amardesh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build installable debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AmarDesh-v1.0.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AmarDesh-v1.0.0-debug-apk
          path: AmarDesh-v1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish downloadable prerelease
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" AmarDesh-v1.0.0-debug.apk --target "$GITHUB_SHA" --prerelease --title "AmarDesh 1.0.0 · build ${GITHUB_RUN_NUMBER}" --notes "Installable Android debug build. Android 7.0+ (API 24). Debug signing is for testing; uninstall an older differently signed build before installation. District content is a curated starter collection; see README for coverage and validation limits."
      - name: Publish tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" AmarDesh-v1.0.0-debug.apk --title "AmarDesh ${GITHUB_REF_NAME}" --notes "Debug-signed APK for testing. See README for production signing."
      - uses: actions/upload-artifact@v4
        with:
          name: AmarDesh-web
          path: dist
          if-no-files-found: error
      - name: Publish web build on gh-pages branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp -r dist /tmp/amardesh-web
          cd /tmp/amardesh-web
          touch .nojekyll
          git init
          git checkout -b gh-pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "Publish AmarDesh web build ${GITHUB_SHA}"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages

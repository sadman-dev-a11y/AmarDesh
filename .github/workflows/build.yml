name: Verify and build AmarDesh
on:
  push:
    branches: [main, CineDesk]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amardesh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run build
      - name: Browser smoke tests and accessibility
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AmarDesh-v3-QA
          path: |
            release/screenshots
            test-results
          if-no-files-found: ignore
      - run: npx cap sync android
      - name: Build optimized release APK and AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Verify bundled content and release flags
        run: |
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          python3 scripts/verify-apk.py "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" > /tmp/identity.txt
          cat /tmp/identity.txt
          if grep -q application-debuggable /tmp/identity.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: AmarDesh-v3-release-unsigned
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: AmarDesh-web
          path: dist
